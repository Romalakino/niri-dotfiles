[plugin_settings."noctalia/screen_recorder"]
directory = "/home/vlad/Видео"
filename_pattern = "Запись %Y-%m-%d %H-%M-%S"
frame_rate = 120
glyph_pending = "loader-2"
glyph_recording = "video-filled"
post_save_script = "/home/vlad/.local/bin/noctalia-recorder-rename.sh"
video_codec = "hevc"
video_qp = 26
video_source = "focused"

[plugin_settings."noctalia/wallhaven"]
download_dir = "/home/vlad/Изображения/Wallpapers"

[plugin_settings."vlad-dev/ruh-vpn"]
geoip_country = false
vpn_panel_placement = "floating"

[plugins]
auto_update = "none"
enabled = [
    "noctalia/wallhaven",
    "kenn/keybind-cheatsheet",
    "vn1k/cursor",
    "noctalia/notes",
    "vlad-dev/timer",
    "noctalia/mpvpaper",
    "noctalia/screen_recorder",
    "vlad-dev/equalizer",
    "vlad-dev/ruh-vpn"
]

    [[plugins.source]]
